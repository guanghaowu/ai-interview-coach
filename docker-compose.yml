# Compose 规范已废弃顶层 version 字段（写了会告警），故不声明。
# 所有子命令均由 docker compose v2 自动识别。

services:
  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: ai-coach-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ai_coach
      TZ: Asia/Shanghai
    ports:
      # 本机原生 MySQL(mysqld.exe) 占用 3306，容器改用 3307 避免端口冲突
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: ai-coach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== RocketMQ（Day 5 启用）==========
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: ai-coach-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: ai-coach-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    volumes:
      - ./broker.conf:/home/rocketmq/broker.conf
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    depends_on:
      - rocketmq-namesrv

  # ========== 应用本体 ==========
  ai-coach-app:
    build: .
    image: ai-coach-app:latest
    container_name: ai-coach-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # docker profile（host 走服务名）+ local（读取挂载进来的私有 Key）
      SPRING_PROFILES_ACTIVE: docker,local
      SERVER_PORT: 8080
    volumes:
      # 把宿主机的私有配置挂进容器（只读）。Key 不写进镜像、不进 git。
      - ./src/main/resources/application-local.yml:/app/config/application-local.yml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ========== 前端（nginx 托管静态资源 + 反代 /api）==========
  # 访问入口： http://localhost:8081
  # 前端所有请求走相对路径 /api/**，由 nginx 反代到 ai-coach-app:8080，
  # 因此同源、无跨域，前端代码在 dev / prod 两种环境零改动。
  ai-coach-web:
    build: ./client
    image: ai-coach-web:latest
    container_name: ai-coach-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      ai-coach-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  redis_data: