spring:
  # ===== MySQL 数据源 =====
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/ai_coach?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# ===== RocketMQ（必须放顶层！放在 spring: 下 starter 读不到）=====
rocketmq:
  name-server: localhost:9876
  producer:
    group: ai-coach-producer
    send-message-timeout: 10000
    retry-times-when-send-failed: 2

# ===== LangChain4j（DeepSeek OpenAI 兼容）=====
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:sk-your-api-key-here}
      model-name: deepseek-chat
      temperature: 0.7
      max-tokens: 2000
      timeout: 60s

# ===== 自定义业务配置 =====
app:
  jwt:
    # 生产环境务必用环境变量注入，这里只是默认值
    secret: ${JWT_SECRET:ai-coach-jwt-secret-key-please-change-in-production-2026-must-be-long-enough}
    expire-hours: 24
    header: Authorization
    prefix: "Bearer "
  ai:
    daily-quota: 10
    cache-days: 30
  rate-limit:
    enabled: true
    tokens-per-day: 10