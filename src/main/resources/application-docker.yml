# =====================================================
# Docker 容器内运行专用配置（profile: docker）
#
# 与 dev 的区别：所有 host 从 localhost 改为 docker-compose 的服务名，
# 因为容器之间通过 service name 通信，localhost 指向容器自己。
# =====================================================

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # host 用服务名 mysql，端口用容器内端口 3306（不是宿主映射的 3307）
    url: jdbc:mysql://mysql:3306/ai_coach?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true

  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 5000ms

rocketmq:
  name-server: rocketmq-namesrv:9876
  producer:
    group: ai-coach-producer
    send-message-timeout: 10000

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:sk-your-api-key-here}
      model-name: deepseek-chat
      temperature: 0.7
      max-tokens: 2000
      timeout: 60s

app:
  jwt:
    secret: ${JWT_SECRET:ai-coach-jwt-secret-key-please-change-in-production-2026-must-be-long-enough}
    expire-hours: 24
  ai:
    daily-quota: 10
    cache-days: 30
