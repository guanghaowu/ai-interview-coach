brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
namesrvAddr = rocketmq-namesrv:9876
autoCreateTopicEnable = true
# broker 对外暴露的地址。
# 用 host.docker.internal 而非 127.0.0.1：
#   - 宿主应用通过 host.docker.internal:10911 → 端口映射 → broker ✅
#   - 容器内应用同样能解析该地址 ✅
#   （若写 127.0.0.1，容器内应用会去连它自己的 127.0.0.1，导致投递失败）
brokerIP1 = host.docker.internal
